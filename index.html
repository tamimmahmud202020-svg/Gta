<style>

canvas{display:block;position:fixed;inset:0}

button.big{font-size:20px;padding:14px 28px;margin:8px;border:2px solid #ff2d95;background:#111;color:#fff;border-radius:8px}

</style></head><body>
<div id="vig"></div><div id="grain"></div><canvas id="map" class="hide" width="130" height="130" style="position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:6;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);pointer-events:none"></canvas><div id="pz2" class="ov ui hide" style="z-index:40"><h2 style="margin:0 0 8px">Paused</h2><label>Look sensitivity <input type="range" id="sn" min="0.4" max="2.5" step="0.1" value="1"></label><label>Volume <input type="range" id="vl" min="0" max="1" step="0.05" value="0.7"></label><div><button class="big" id="gq">Graphics: High</button><button class="big" id="rn2">Rain: Off</button></div><div><button class="big" id="rs">Reset save</button><button class="big" id="rm">Resume</button></div></div>

<div id="msg" class="hide"></div><div id="hf" style="position:fixed;inset:0;background:rgba(255,255,255,.35);opacity:0;transition:opacity .15s;pointer-events:none;z-index:7"></div><div id="bar" class="ui hide" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:rgba(0,0,0,.9);border:2px solid #ff2d95;border-radius:10px;padding:14px;text-align:center;min-width:270px"><div id="bt" style="margin-bottom:8px;font-size:15px"></div><button class="big" id="b1">Drink</button><button class="big" id="b2">Dice $50</button><button class="big" id="b3">Dice $200</button><button class="big" id="b4">Leave</button></div><div id="lpp" class="ui hide" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:rgba(0,0,0,.9);border:2px solid #ff2d95;border-radius:10px;padding:14px;text-align:center;min-width:270px"><div id="lpt"></div><div style="position:relative;width:260px;height:26px;background:#333;margin:12px auto;border-radius:6px"><div id="lz" style="position:absolute;top:0;height:100%;background:#2c2;opacity:.8"></div><div id="lm" style="position:absolute;top:-3px;left:0;width:6px;height:32px;background:#fff"></div></div><button class="big" id="lpb">PICK</button></div><div id="wst" class="hide" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:900 54px system-ui;color:#c00;text-shadow:0 0 12px #000;background:rgba(80,0,0,.45);z-index:15;pointer-events:none">WASTED</div><div id="xh" class="hide" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 26px system-ui;color:#fff;z-index:6;pointer-events:none;text-shadow:0 0 3px #000">+</div><div id="fr" class="btn hide" style="right:130px;bottom:110px;width:76px;height:76px;background:rgba(255,45,45,.3)">FIRE</div><div id="hn" class="btn hide" style="right:282px">Horn</div><div id="lt" class="btn hide" style="right:24px;bottom:110px">Light</div><div id="rd" class="btn hide" style="right:222px;bottom:110px">Radio</div><div id="pz" class="btn hide" style="top:calc(8px + env(safe-area-inset-top));bottom:auto;left:50%;transform:translateX(-50%);width:52px;height:52px">II</div>
<div id="jb" class="hide"><div id="jk"></div></div>
<div id="sp" class="btn hide" style="right:110px">Sprint</div>
<div id="ea" class="btn hide" style="right:24px">E</div><div id="cm" class="btn hide" style="right:196px">Cam</div><div id="spd" class="hide" style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;font:700 22px system-ui;text-shadow:0 0 4px #000"></div>
<div class="lb hide" id="lb1" style="top:0"></div><div class="lb hide" id="lb2" style="bottom:0"></div>

<div id="start" class="ov"><h1>VILLAGE NOIR</h1><p>Mini open-world crime drama</p><button class="big" id="go">TAP TO START</button></div>
<div id="gate" class="ov hide"><h1>18+ Mature Content</h1><p>Crime themes, strong language, and intense (non-graphic) violence.<br>Are you 18 or older?</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Setup =====
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:false});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new THREE.Scene(),SKY=0x2a2f4a;S.background=new THREE.Color(SKY);S.fog=new THREE.Fog(SKY,20,110);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,200);
const hemi=new THREE.HemisphereLight(0x8899cc,0x222233,.95);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffddaa,.5);sun.position.set(20,40,10);S.add(sun);
const mats={},mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const geoB=new THREE.BoxGeometry(1,1,1),walls=[];
function box(w,h,d,c,x,y,z,solid){const m=new THREE.Mesh(geoB,mat(c));m.scale.set(w,h,d);m.position.set(x,y+h/2,z);S.add(m);
 if(solid)walls.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});return m}
function cyl(rt,rb,h,seg,c,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c));m.position.set(x,y+h/2,z);S.add(m);return m}
function glow(w,h,d,c,x,y,z){const m=new THREE.Mesh(geoB,new THREE.MeshBasicMaterial({color:c}));m.scale.set(w,h,d);m.position.set(x,y,z);S.add(m);return m}

// ===== World =====
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x2f4a2f));ground.rotation.x=-Math.PI/2;S.add(ground);
box(6,.04,200,0x2b2b30,0,0,0);box(200,.04,6,0x2b2b30,0,0,0);
box(.2,.05,200,0xccaa33,0,0,0);box(200,.05,.2,0xccaa33,0,0,0);
// building: f=+1 door faces +z, f=-1 door faces -z
function building(cx,cz,w,d,h,wc,rc,f,pyr){const t=.4,g=1.1,fw=w/2-g,fz=cz+f*d/2;
 box(w,h,t,wc,cx,0,cz-f*d/2,1);box(t,h,d,wc,cx-w/2,0,cz,1);box(t,h,d,wc,cx+w/2,0,cz,1);
 box(fw,h,t,wc,cx-w/2+fw/2,0,fz,1);box(fw,h,t,wc,cx+w/2-fw/2,0,fz,1);box(2*g,h-2.6,t,wc,cx,2.6,fz);
 box(w-.4,.05,d-.4,0x4a3a2a,cx,0,cz);box(w+1,.3,d+1,rc,cx,h,cz);
 if(pyr){const r=new THREE.Mesh(new THREE.CylinderGeometry(0,w*.78,2.4,4),mat(rc));r.rotation.y=Math.PI/4;r.position.set(cx,h+1.5,cz);S.add(r)}
 const l=new THREE.PointLight(0xffcc88,.7,12);l.position.set(cx,h-.8,cz);S.add(l)}
// Bar
const BX=-16,BZ=-16;building(BX,BZ,10,8,4,0x6b3a3a,0x333340,1,false);
box(6,1.1,.8,0x5a3a1a,BX,0,BZ-1.8,1);
for(let i=-1;i<=1;i++)cyl(.3,.3,.7,8,0x883322,BX+i*1.8,0,BZ-.6);
[1.7,2.5].forEach(y=>{box(7,.15,.5,0x4a3220,BX,y,BZ-3.7);
 for(let i=-3;i<=3;i++)cyl(.1,.1,.4,6,[0x22aa55,0xaa7722,0x2266cc][i+3&1?1:0],BX+i*.9,y+.15,BZ-3.7)});
box(.6,1.1,.4,0x222222,BX,0,BZ-3,0);
const bart={x:BX,z:BZ-3};
const head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),mat(0xddaa88));head.position.set(BX,1.35,BZ-3);S.add(head);
const sign=glow(5,.9,.2,0xff2d95,BX,3.3,BZ+4.25);
const neon=new THREE.PointLight(0xff2d95,1.2,16);neon.position.set(BX,3,BZ+6);S.add(neon);
// Houses
const HC=[0xb08a60,0x7a9ab0,0xb0a060,0x9a6a9a,0x6a9a7a],RC=[0x8a3a2a,0x3a4a8a,0x8a5a2a,0x5a2a5a,0x2a5a3a];
[[16,-16,1],[34,-16,1],[-16,16,-1],[16,16,-1],[34,16,-1]].forEach((p,i)=>building(p[0],p[2]*0+p[1],8,8,3.4,HC[i],RC[i],p[2],true));
const B=[[BX,BZ],[16,-16],[34,-16],[-16,16],[16,16],[34,16]];
// Trees (seeded)
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
for(let n=0;n<40;){const x=(rnd()-.5)*140,z=(rnd()-.5)*140;
 if(Math.abs(x)<8||Math.abs(z)<8||B.some(b=>Math.hypot(x-b[0],z-b[1])<12))continue;n++;
 cyl(.25,.3,2,6,0x5a3a1a,x,0,z);const k=new THREE.Mesh(new THREE.SphereGeometry(1.5+rnd(),6,5),mat(rnd()<.5?0x2a6a2a:0x3a7a30));k.position.set(x,3.2,z);S.add(k);
 walls.push({x1:x-.35,x2:x+.35,z1:z-.35,z2:z+.35})}
// Bushes
for(let n=0;n<25;){const x=(rnd()-.5)*100,z=(rnd()-.5)*100;if(Math.abs(x)<6||Math.abs(z)<6||B.some(b=>Math.hypot(x-b[0],z-b[1])<8))continue;n++;
 const k=new THREE.Mesh(new THREE.SphereGeometry(.7,6,5),mat(0x2f6a35));k.position.set(x,.5,z);S.add(k)}
// Fences
function fence(x,z,len,axis){for(let i=0;i<=len;i+=2){axis?box(.15,1,.15,0x8a6a4a,x,0,z+i):box(.15,1,.15,0x8a6a4a,x+i,0,z)}
 axis?box(.1,.1,len,0x8a6a4a,x,.7,z+len/2,1):box(len,.1,.1,0x8a6a4a,x+len/2,.7,z,1)}
fence(-30,-28,24,0);fence(10,-28,34,0);fence(10,28,34,0);fence(-30,28,24,0);fence(44,-28,20,1);
// Lamp posts
for(let z=-45;z<=45;z+=15){if(Math.abs(z)<4)continue;[-4,4].forEach(x=>{cyl(.08,.1,4,6,0x222222,x,0,z);glow(.4,.4,.4,0xffdd88,x,4.2,z)})}
for(let x=-45;x<=45;x+=15){if(Math.abs(x)<4)continue;[-4,4].forEach(z=>{cyl(.08,.1,4,6,0x222222,x,0,z);glow(.4,.4,.4,0xffdd88,x,4.2,z)})}

// ===== Player & Controls =====
const P={x:0,z:8,yaw:0,pitch:0,bob:0,cash:0,stars:0,hp:100,score:0,heat:0,resp:0};let playing=false;
let joy=null,look=null,spId=null,jv={x:0,y:0};
function hitWall(x,z,r){r=r||.4;return walls.some(w=>x>w.x1-r&&x<w.x2+r&&z>w.z1-r&&z<w.z2+r)}
function say(t,ms){const m=$('msg');m.textContent=t;m.classList.remove('hide');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.add('hide'),ms||2500)}
function interact(){if(lp.on||bar.on)return;if(driving)return exitCar();if(crimeE())return;if(Math.hypot(P.x-car.x,P.z-car.z)<4)return enterCar();if(Math.hypot(P.x-bart.x,P.z-bart.z)<3.5)openBar();else say('Nothing nearby.',1200)}
document.addEventListener('touchstart',e=>{if(!playing||(e.target.closest&&e.target.closest('.ui')))return;e.preventDefault();
 for(const t of e.changedTouches){const b=t.target.closest&&t.target.closest('.btn');
  if(b){if(b.id==='sp')spId=t.identifier;else if(b.id==='fr')fireId=t.identifier;else if(b.id==='hn')hornId=t.identifier;else if(b.id==='rd')radioBtn();else if(b.id==='lt')toggleLight();else if(b.id==='pz')openPause();else if(b.id==='cm')camMode=camMode===3?1:3;else interact();continue}
  if(t.clientX<innerWidth*.45){if(!joy){joy={id:t.identifier,x:t.clientX,y:t.clientY};const jb=$('jb');jb.style.left=t.clientX+'px';jb.style.top=t.clientY+'px';jb.classList.remove('hide');$('jk').style.transform=''}}
  else if(!look)look={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});
document.addEventListener('touchmove',e=>{if(!playing||(e.target.closest&&e.target.closest('.ui')))return;e.preventDefault();
 for(const t of e.changedTouches){
  if(joy&&t.identifier===joy.id){let dx=t.clientX-joy.x,dy=t.clientY-joy.y;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}
   jv.x=dx/m;jv.y=dy/m;$('jk').style.transform=`translate(${dx}px,${dy}px)`}
  else if(look&&t.identifier===look.id){P.yaw-=(t.clientX-look.x)*.006*sens;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(t.clientY-look.y)*.006*sens));look.x=t.clientX;look.y=t.clientY}}},{passive:false});
const endT=e=>{for(const t of e.changedTouches){
 if(joy&&t.identifier===joy.id){joy=null;jv.x=jv.y=0;$('jb').classList.add('hide')}
 if(look&&t.identifier===look.id)look=null;if(t.identifier===spId)spId=null;if(t.identifier===fireId)fireId=null;if(t.identifier===hornId)hornId=null}};
document.addEventListener('touchend',endT);document.addEventListener('touchcancel',endT);
function walk(dt,t){const sp=spId!==null?7:4,f=-jv.y,r=jv.x,s=Math.sin(P.yaw),c=Math.cos(P.yaw);
 const vx=(-s*f+c*r)*sp*dt,vz=(-c*f-s*r)*sp*dt;
 if(!hitWall(P.x+vx,P.z))P.x+=vx;if(!hitWall(P.x,P.z+vz))P.z+=vz;
 const mv=Math.hypot(jv.x,jv.y);if(mv>.1)P.bob+=dt*(spId!==null?12:8);
 cam.position.set(P.x,1.7+Math.sin(P.bob)*.04*mv,P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');
 }
function hud(){$('rep').textContent='Heat '+Math.round(P.heat)+'  Respect '+Math.round(P.resp);$('score').textContent=P.score;$('hp').textContent=Math.max(0,Math.round(P.hp));$('cash').textContent=P.cash;$('stars').textContent='\u2605'.repeat(P.stars)+'\u2606'.repeat(3-P.stars)}

// ===== Vehicles / NPCs / Police =====
function mkCar(col,police){const g=new THREE.Group(),m=(w,h,d,c,x,y,z)=>{const b=new THREE.Mesh(geoB,mat(c));b.scale.set(w,h,d);b.position.set(x,y,z);g.add(b);return b};
 const lm=(c,x,z)=>{const b=new THREE.Mesh(geoB,new THREE.MeshBasicMaterial({color:c}));b.scale.set(.35,.2,.1);b.position.set(x,.7,z);g.add(b)};
 m(1.8,.6,4,col,0,.65,0);m(1.5,.55,2,police?0xeeeeee:0x223344,0,1.2,.2);
 [[-.95,1.3],[.95,1.3],[-.95,-1.3],[.95,-1.3]].forEach(p=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.3,8),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(p[0],.35,p[1]);g.add(w)});
 [-.6,.6].forEach(x=>{lm(0xffffcc,x,-2);lm(0xff2222,x,2)});
 if(police)g.rb=[m(.5,.2,.5,0xff0000,-.4,1.55,.2),m(.5,.2,.5,0x0000ff,.4,1.55,.2)];
 S.add(g);return g}
const car={g:mkCar(0xcc2222),x:6,z:8,h:0,v:0};car.g.position.set(6,0,8);
const ai={g:mkCar(0x2288cc),x:1.5,z:-50,h:Math.PI,wp:[[1.5,50],[-1.5,50],[-1.5,-50],[1.5,-50]],i:0,stop:0};
const pol={g:mkCar(0x1a1a66,1),x:0,z:0,h:0,on:false};pol.g.visible=false;
let driving=false,camMode=3,clearT=0;
const peds=[[[-6,-6],[-6,6],[6,6],[6,-6]],[[-40,5],[40,5]],[[5,-40],[5,40]]].map(w=>{const g=new THREE.Group();
 const b=new THREE.Mesh(geoB,mat(0x886644));b.scale.set(.5,1.1,.3);b.position.y=.8;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),mat(0xddaa88));h.position.y=1.6;g.add(h);g.position.set(w[0][0],0,w[0][1]);S.add(g);
 return {g,x:w[0][0],z:w[0][1],w,i:1,down:0}});
function wanted(n){P.heat=Math.min(100,P.heat+3);clearT=0;if(P.stars<n){P.stars=n;hud();say('WANTED \u2605',2000)}if(!pol.on)spawnPol()}
function spawnPol(){if(pol.wait>0)return;pol.hp=8;const p=driving?car:P;pol.on=true;pol.g.visible=true;pol.x=1.5;pol.z=p.z>0?-45:45;pol.h=0}
function busted(){const l=Math.floor(P.cash*.2);P.cash-=l;P.stars=0;pol.on=false;pol.g.visible=false;driving=false;$('spd').classList.add('hide');car.v=0;P.x=0;P.z=8;P.yaw=0;P.pitch=0;hud();say('BUSTED! You lost $'+l,4000)}
function enterCar(){if(car.locked){say('Locked!',1500);return}driving=true;$('spd').classList.remove('hide');camMode=3;cam.position.set(car.x,3.5,car.z+7)}
function exitCar(){driving=false;$('spd').classList.add('hide');car.v=0;const s=Math.sin(car.h),c=Math.cos(car.h);let x=car.x-c*2.4,z=car.z+s*2.4;
 if(hitWall(x,z)){x=car.x+c*2.4;z=car.z-s*2.4}P.x=x;P.z=z;P.yaw=car.h;P.pitch=0}
function drive(dt){const th=-jv.y;car.v+=th*(th>0?14:18)*dt;car.v-=car.v*.8*dt;if(Math.abs(th)<.1)car.v-=Math.sign(car.v)*Math.min(Math.abs(car.v),3*dt);
 car.v=Math.max(-6,Math.min(18,car.v));
